<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax slice">
  <!-- NYC Skyline: geometric silhouette -->
  <g fill="currentColor">
    <!-- Far left buildings -->
    <rect x="20" y="120" width="30" height="80"/>
    <rect x="55" y="100" width="25" height="100"/>
    <rect x="85" y="130" width="35" height="70"/>
    <!-- Mid-left cluster -->
    <rect x="140" y="90" width="28" height="110"/>
    <rect x="172" y="70" width="22" height="130"/>
    <rect x="198" y="110" width="32" height="90"/>
    <!-- Chrysler-inspired -->
    <rect x="260" y="50" width="26" height="150"/>
    <polygon points="265,50 286,50 273,25"/>
    <!-- Empire State inspired -->
    <rect x="320" y="30" width="30" height="170"/>
    <rect x="328" y="15" width="14" height="15"/>
    <rect x="332" y="0" width="6" height="15"/>
    <!-- Mid cluster -->
    <rect x="370" y="80" width="25" height="120"/>
    <rect x="400" y="60" width="28" height="140"/>
    <rect x="432" y="95" width="22" height="105"/>
    <rect x="458" y="75" width="30" height="125"/>
    <!-- One WTC inspired -->
    <rect x="520" y="20" width="28" height="180"/>
    <polygon points="527,20 541,20 534,8"/>
    <!-- Right-mid buildings -->
    <rect x="570" y="90" width="35" height="110"/>
    <rect x="610" y="70" width="25" height="130"/>
    <rect x="640" y="100" width="30" height="100"/>
    <rect x="680" y="85" width="22" height="115"/>
    <!-- Brooklyn-side buildings -->
    <rect x="740" y="110" width="40" height="90"/>
    <rect x="785" y="95" width="28" height="105"/>
    <rect x="820" y="120" width="35" height="80"/>
    <rect x="860" y="105" width="25" height="95"/>
    <!-- Far right -->
    <rect x="910" y="130" width="30" height="70"/>
    <rect x="945" y="115" width="25" height="85"/>
    <rect x="980" y="135" width="35" height="65"/>
    <rect x="1030" y="125" width="28" height="75"/>
    <rect x="1070" y="140" width="40" height="60"/>
    <rect x="1120" y="130" width="30" height="70"/>
    <rect x="1155" y="145" width="25" height="55"/>
    <!-- Base ground -->
    <rect x="0" y="190" width="1200" height="10"/>
  </g>
</svg>
