<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax slice">
  <!-- London Skyline: geometric silhouette -->
  <g fill="currentColor">
    <!-- Far left low buildings -->
    <rect x="20" y="140" width="40" height="60"/>
    <rect x="65" y="130" width="30" height="70"/>
    <rect x="100" y="145" width="35" height="55"/>
    <!-- Canary Wharf cluster -->
    <rect x="160" y="70" width="25" height="130"/>
    <rect x="190" y="55" width="22" height="145"/>
    <rect x="216" y="80" width="25" height="120"/>
    <!-- The Gherkin inspired (oval) -->
    <ellipse cx="290" cy="100" rx="18" ry="60"/>
    <rect x="272" y="160" width="36" height="40"/>
    <!-- Tower Bridge inspired -->
    <rect x="350" y="90" width="18" height="110"/>
    <rect x="400" y="90" width="18" height="110"/>
    <rect x="350" y="90" width="68" height="15"/>
    <rect x="360" y="75" width="8" height="15"/>
    <rect x="400" y="75" width="8" height="15"/>
    <!-- The Shard inspired -->
    <polygon points="480,10 500,10 505,200 475,200"/>
    <line x1="490" y1="10" x2="490" y2="0" stroke="currentColor" stroke-width="3"/>
    <!-- Parliament / Big Ben area -->
    <rect x="560" y="100" width="80" height="100"/>
    <rect x="570" y="85" width="10" height="15"/>
    <rect x="590" y="85" width="10" height="15"/>
    <rect x="610" y="85" width="10" height="15"/>
    <rect x="630" y="85" width="10" height="15"/>
    <!-- Big Ben tower -->
    <rect x="645" y="40" width="20" height="160"/>
    <polygon points="648,40 662,40 655,25"/>
    <rect x="653" y="15" width="4" height="10"/>
    <!-- St Paul's dome -->
    <rect x="720" y="120" width="70" height="80"/>
    <ellipse cx="755" cy="120" rx="35" ry="30"/>
    <rect x="748" y="80" width="14" height="40"/>
    <ellipse cx="755" cy="80" rx="10" ry="8"/>
    <!-- Mid buildings -->
    <rect x="810" y="110" width="30" height="90"/>
    <rect x="845" y="95" width="25" height="105"/>
    <rect x="875" y="120" width="35" height="80"/>
    <!-- Walkie Talkie inspired -->
    <polygon points="935,60 965,60 975,200 925,200"/>
    <!-- Right buildings -->
    <rect x="1000" y="110" width="30" height="90"/>
    <rect x="1035" y="125" width="25" height="75"/>
    <rect x="1070" y="135" width="35" height="65"/>
    <rect x="1110" y="140" width="30" height="60"/>
    <rect x="1145" y="150" width="35" height="50"/>
    <!-- Base ground -->
    <rect x="0" y="190" width="1200" height="10"/>
  </g>
</svg>
