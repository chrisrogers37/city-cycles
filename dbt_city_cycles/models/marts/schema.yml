version: 2

models:
  - name: mart_daily_metrics
    description: >
      Daily aggregated ride metrics for both NYC and London.
      Includes total rides, average duration, member/casual splits, and per-capita
      normalization using population seed data.
    columns:
      - name: location
        description: City identifier (nyc or london)
        tests:
          - not_null
          - accepted_values:
              values: ['nyc', 'london']
      - name: date
        description: Calendar date
        tests:
          - not_null
      - name: year
        description: Year
      - name: day_type
        description: "weekday or weekend"
      - name: total_rides
        description: Total number of rides on this date for this location
        tests:
          - not_null
      - name: avg_duration_minutes
        description: Average ride duration in minutes
      - name: member_rides
        description: Number of rides by members (NULL for London)
      - name: casual_rides
        description: Number of rides by casual users (NULL for London)
      - name: unknown_user_type_rides
        description: Number of rides with unknown or NULL user type
      - name: total_minutes_biked
        description: Total minutes of bike usage
      - name: population
        description: City population for the year (from population seed)
      - name: rides_per_1000
        description: Rides per 1,000 population (normalized metric)

  - name: mart_daily_metrics_long
    description: >
      Long-format version of mart_daily_metrics where each metric is a separate row.
      Used by the Streamlit dashboard for flexible Plotly charting.
    columns:
      - name: location
        description: City identifier
        tests:
          - not_null
      - name: date
        description: Calendar date
        tests:
          - not_null
      - name: year
        description: Year
      - name: day_type
        description: "weekday or weekend"
      - name: metric_name
        description: Name of the metric
        tests:
          - not_null
          - accepted_values:
              values:
                - total_rides
                - avg_duration_minutes
                - member_rides
                - casual_rides
                - total_minutes_biked
                - population
                - rides_per_1000
      - name: metric_value
        description: Numeric value of the metric

  - name: mart_hourly_rides
    description: >
      Granular ride metrics aggregated by location, date, and hour of day.
      This is the date-aware replacement for mart_hourly_patterns, enabling
      time-series analysis and weather correlation joins.
    columns:
      - name: location
        description: City identifier (nyc or london)
        tests:
          - not_null
          - accepted_values:
              values: ['nyc', 'london']
      - name: date
        description: Calendar date
        tests:
          - not_null
      - name: hour_of_day
        description: Hour of day (0-23)
        tests:
          - not_null
      - name: ride_count
        description: Total number of rides in this hour on this date
        tests:
          - not_null
      - name: avg_duration_seconds
        description: Average ride duration in seconds for this hour on this date
      - name: member_rides
        description: Number of rides by members (0 for London, which has no user type data)
      - name: casual_rides
        description: Number of rides by casual users (0 for London, which has no user type data)

  - name: mart_hourly_patterns_summary
    description: >
      Ride counts aggregated by hour of day and location across all dates.
      Backward-compatible replacement for the original mart_hourly_patterns.
      Derived from mart_hourly_rides by aggregating out the date dimension.
      Used by the Streamlit dashboard Time of Day Analysis chart.
    columns:
      - name: location
        description: City identifier
        tests:
          - not_null
      - name: hour_of_day
        description: Hour of day (0-23)
        tests:
          - not_null
      - name: ride_count
        description: Total number of rides in this hour across all dates
        tests:
          - not_null

  - name: mart_weather_ride_correlation
    description: >
      Hourly ride metrics joined with weather data for ride-weather correlation analysis.
      Inner join of mart_hourly_rides and stg_weather_hourly on (location, date, hour_of_day).
      Contains both ride and weather metrics at hourly granularity.
    columns:
      - name: location
        description: City identifier (nyc or london)
        tests:
          - not_null
          - accepted_values:
              values: ['nyc', 'london']
      - name: date
        description: Calendar date
        tests:
          - not_null
      - name: hour_of_day
        description: Hour of day (0-23)
        tests:
          - not_null
      - name: ride_count
        description: Total rides in this hour
        tests:
          - not_null
      - name: avg_duration_seconds
        description: Average ride duration in seconds
      - name: member_rides
        description: Member ride count (0 for London)
      - name: casual_rides
        description: Casual ride count (0 for London)
      - name: temperature_celsius
        description: Temperature at 2 meters (Celsius)
      - name: apparent_temperature_celsius
        description: Feels-like temperature (Celsius)
      - name: relative_humidity_pct
        description: Relative humidity percentage
      - name: precipitation_mm
        description: Precipitation amount (mm)
      - name: rain_mm
        description: Rain amount (mm)
      - name: snowfall_cm
        description: Snowfall amount (cm)
      - name: snow_depth_m
        description: Snow depth (meters)
      - name: weather_code
        description: WMO weather code
      - name: weather_condition
        description: Human-readable weather condition (lowercase)
      - name: cloud_cover_pct
        description: Cloud cover percentage
      - name: wind_speed_kmh
        description: Wind speed (km/h)
      - name: wind_gusts_kmh
        description: Wind gust speed (km/h)
      - name: is_precipitation
        description: Boolean flag for precipitation
      - name: precipitation_intensity
        description: Precipitation intensity category
      - name: temperature_band
        description: Temperature band category
      - name: wind_category
        description: Wind intensity category

  - name: mart_weather_impact_summary
    description: >
      Pre-computed weather impact statistics for ride recommendations.
      Shows how ride counts and durations change relative to clear-weather baseline
      for each (location, hour_of_day) broken down by weather condition and by
      precipitation/temperature band combinations.
      Powers dashboard insights like "34% fewer rides when raining at 9am."
    columns:
      - name: location
        description: City identifier (nyc or london)
        tests:
          - not_null
          - accepted_values:
              values: ['nyc', 'london']
      - name: hour_of_day
        description: Hour of day (0-23)
        tests:
          - not_null
      - name: dimension_type
        description: "Type of grouping: 'weather_condition' or 'precip_temp'"
        tests:
          - not_null
          - accepted_values:
              values: ['weather_condition', 'precip_temp']
      - name: dimension_value
        description: Weather condition name (when dimension_type is 'weather_condition'), NULL otherwise
      - name: is_precipitation
        description: Boolean precipitation flag (when dimension_type is 'precip_temp'), NULL otherwise
      - name: temperature_band
        description: Temperature band (when dimension_type is 'precip_temp'), NULL otherwise
      - name: observation_count
        description: Number of (date, hour) observations in this group
        tests:
          - not_null
      - name: avg_rides
        description: Average ride count per hour in this weather group
      - name: avg_duration_seconds
        description: Average ride duration in seconds in this weather group
      - name: avg_member_rides
        description: Average member ride count (0 for London)
      - name: avg_casual_rides
        description: Average casual ride count (0 for London)
      - name: baseline_avg_rides
        description: Average rides at the same hour during clear weather (baseline)
      - name: baseline_avg_duration_seconds
        description: Average duration at the same hour during clear weather (baseline)
      - name: pct_change_rides_vs_clear
        description: Percentage change in rides vs clear weather baseline (e.g., -34.0 means 34% fewer rides)
      - name: pct_change_duration_vs_clear
        description: Percentage change in duration vs clear weather baseline

  - name: mart_station_growth
    description: >
      Year-over-year station count growth by location.
      Calculates distinct station counts per year, joins population data,
      and computes year-over-year growth percentage.
    columns:
      - name: location
        description: City identifier
        tests:
          - not_null
      - name: year
        description: Year
        tests:
          - not_null
      - name: station_count
        description: Number of distinct stations active in this year
        tests:
          - not_null
      - name: population
        description: City population for the year (from population seed)
      - name: stations_per_1000
        description: Stations per 1,000 population
      - name: prev_year_count
        description: Station count from the previous year (NULL for first year)
      - name: yoy_growth
        description: Year-over-year growth percentage (NULL for first year)

  - name: mart_station_directory
    description: >
      Reference dimension table for all bike share stations across NYC and London.
      One row per (location, station_id). NYC stations include latitude/longitude
      coordinates; London stations have NULL for coordinates.
    columns:
      - name: location
        description: City identifier (nyc or london)
        tests:
          - not_null
          - accepted_values:
              values: ['nyc', 'london']
      - name: station_id
        description: Unique station identifier within each city
        tests:
          - not_null
      - name: station_name
        description: Most recent station name
        tests:
          - not_null
      - name: latitude
        description: Station latitude (NYC only, NULL for London)
      - name: longitude
        description: Station longitude (NYC only, NULL for London)
      - name: total_rides
        description: Total number of departures from this station across all time
        tests:
          - not_null
      - name: first_ride_date
        description: Date of the earliest recorded ride departing from this station
        tests:
          - not_null
      - name: last_ride_date
        description: Date of the most recent recorded ride departing from this station
        tests:
          - not_null

  - name: mart_station_weather_performance
    description: >
      Station-level weather impact analysis. Measures how each station's ridership
      and trip duration change under different weather conditions compared to clear
      weather. Grain is (location, station_id, hour_of_day, weather_condition).
      Only includes station-hour-condition combinations with at least 100 rides.
    columns:
      - name: location
        description: City identifier (nyc or london)
        tests:
          - not_null
          - accepted_values:
              values: ['nyc', 'london']
      - name: station_id
        description: Station identifier
        tests:
          - not_null
      - name: hour_of_day
        description: Hour of day (0-23)
        tests:
          - not_null
      - name: weather_condition
        description: "Weather condition category from stg_weather_hourly"
        tests:
          - not_null
      - name: total_rides
        description: Total rides departing from this station in this hour under this weather condition
        tests:
          - not_null
      - name: avg_rides_per_day
        description: Average rides per day for this station-hour-condition (normalized by days observed)
      - name: avg_duration_minutes
        description: Average ride duration in minutes
      - name: days_observed
        description: Number of distinct days this weather condition was observed in this hour
        tests:
          - not_null
      - name: pct_change_vs_clear
        description: >
          Percentage change in avg_rides_per_day compared to clear weather for the same station
          and hour. Negative values indicate fewer rides. NULL when no clear-weather baseline exists.

  - name: mart_similar_day_stats
    description: >
      Pre-computed ride statistics grouped by weather similarity dimensions.
      Enables "On days like today, what does bike activity look like?" queries.
      Contains two grains: 'daily' (one row per location/month/day_type/temp_band/precip)
      and 'hourly' (adds hour_of_day for intra-day patterns).
      Upstream: mart_weather_ride_correlation.
    columns:
      - name: grain
        description: "Row granularity: 'daily' or 'hourly'"
        tests:
          - not_null
          - accepted_values:
              values: ['daily', 'hourly']
      - name: location
        description: City identifier (nyc or london)
        tests:
          - not_null
          - accepted_values:
              values: ['nyc', 'london']
      - name: month_num
        description: Month number (1-12) as seasonal proxy
        tests:
          - not_null
      - name: day_type
        description: "weekday or weekend"
        tests:
          - not_null
          - accepted_values:
              values: ['weekday', 'weekend']
      - name: temperature_band
        description: "Temperature category: freezing, cold, mild, warm, hot"
        tests:
          - not_null
          - accepted_values:
              values: ['freezing', 'cold', 'mild', 'warm', 'hot']
      - name: precipitation_intensity
        description: "Precipitation category: none, light, moderate, heavy, extreme"
        tests:
          - not_null
          - accepted_values:
              values: ['none', 'light', 'moderate', 'heavy', 'extreme']
      - name: hour_of_day
        description: Hour of day (0-23). NULL for daily grain rows.
      - name: sample_days
        description: Number of distinct historical days matching this dimension combination
        tests:
          - not_null
      - name: avg_daily_rides
        description: >
          For daily grain: average total rides per day.
          For hourly grain: average rides per hour.
      - name: avg_duration_minutes
        description: Average ride duration in minutes for matching conditions
      - name: avg_member_rides
        description: >
          Average member rides (per day for daily grain, per hour for hourly grain).
          0 for London which has no user type data.
      - name: avg_casual_rides
        description: >
          Average casual rides (per day for daily grain, per hour for hourly grain).
          0 for London which has no user type data.
      - name: pct_change_vs_overall
        description: >
          Percentage difference from overall average daily rides for this location.
          Only populated for daily grain. Positive = more rides than average,
          negative = fewer rides than average.
      - name: duration_pct_change_vs_overall
        description: >
          Percentage difference from overall average duration for this location.
          Only populated for daily grain.
      - name: peak_hour_start
        description: >
          Hour of day (0-23) with highest average rides for this dimension combination.
          Only populated for daily grain. Derived from the hourly grain.
      - name: peak_hour_end
        description: >
          peak_hour_start + 2 (capped at 23). Defines a 2-hour peak window.
          Only populated for daily grain.

  - name: mart_nyc_member_analysis
    description: >
      Monthly member percentage analysis for NYC.
      Calculates what percentage of NYC rides in each month were by members.
    columns:
      - name: location
        description: City identifier (always 'nyc')
        tests:
          - not_null
      - name: month
        description: Month (truncated to first of month)
        tests:
          - not_null
      - name: member_percentage
        description: Percentage of rides by members in this month
        tests:
          - not_null
