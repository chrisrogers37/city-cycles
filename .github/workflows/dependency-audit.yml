name: Dependency Audit

# A pull-request trigger alone cannot catch a dependency CVE: advisories are
# published against pins that are already sitting in the repo unchanged, so no
# PR ever runs. The schedule is the part that closes that — it re-asks the
# question when nothing here has moved. The PR trigger only stops a newly
# vulnerable pin from landing.
on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'api/requirements.txt'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    strategy:
      # Report both files on every run; one failing set must not hide the other.
      fail-fast: false
      matrix:
        include:
          - name: pipeline
            file: requirements.txt
            # Each id is fixed only in sqlparse 0.6.0, which the pinned dbt-core
            # cannot take (see the sqlparse pin in requirements.txt). sqlparse
            # parses only this project's own dbt SQL, never caller-supplied input.
            # Drop each id once sqlparse reaches 0.6.0. Expires 2026-12-31, a
            # review date nothing enforces: re-justify any id still here.
            ignore: >-
              --ignore-vuln PYSEC-2026-3696
              --ignore-vuln PYSEC-2026-3697
              --ignore-vuln PYSEC-2026-3698
              --ignore-vuln PYSEC-2026-3699
              --ignore-vuln PYSEC-2026-3923
          - name: api
            file: api/requirements.txt
            # Deliberately empty: an unreachable-fix suppression carried by a
            # file that does not depend on the package would silently swallow a
            # real future advisory sharing the id.
            ignore: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install pip-audit

      - name: Audit ${{ matrix.name }} dependencies
        # --no-deps audits the pinned lines rather than a resolved environment.
        # requirements.txt is a full freeze, so that is near-complete coverage;
        # api/requirements.txt lists direct dependencies only, so its transitives
        # go unscanned. Locking that file would close the gap.
        run: pip-audit -r ${{ matrix.file }} --no-deps --strict ${{ matrix.ignore }}
