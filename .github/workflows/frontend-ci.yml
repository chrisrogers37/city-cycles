name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx eslint .
        name: Lint

      - run: npx tsc --noEmit
        name: Type check

      - run: npm run build
        name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
